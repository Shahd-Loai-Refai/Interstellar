<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Interstellar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root {
    --space:#050A1A; --night:#0A1433; --blue:#0B3D91; --blue2:#2F6BD8; --red:#FC3D21; --red-d:#D92E14;
    --rust:#C2603A; --dust:#F2C9A8; --ink:#F4F6FB; --muted:#B8C2DC;
    --line:rgba(244,246,251,.14); --panel:rgba(11,61,145,.20);
    --display:"Reem Kufi","Segoe UI",Tahoma,sans-serif;
  }
  html[lang="en"] { --display:"Space Grotesk","Segoe UI",Tahoma,sans-serif; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; font-family:"Segoe UI",Tahoma,system-ui,sans-serif; color:var(--ink); min-height:100vh;
    background:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 28% 72%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 44% 34%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 63% 12%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 77% 58%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 88% 84%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 6% 90%, #fff 50%, transparent 51%),
      radial-gradient(ellipse at 85% -10%, rgba(47,107,216,.42), transparent 55%),
      radial-gradient(ellipse at 0% 110%, rgba(252,61,33,.20), transparent 50%),
      var(--space) fixed; }
  button, select { font:inherit; }
  .btn { background:var(--blue); color:var(--ink); border:1px solid rgba(244,246,251,.25); border-radius:12px;
         padding:11px 20px; cursor:pointer; font-weight:600; transition:background .15s ease, transform .08s ease; }
  .btn:hover { background:var(--blue2); }
  .btn:active { transform:scale(.98); }
  .btn.red { background:var(--red); border-color:var(--red); }
  .btn.red:hover { background:var(--red-d); }
  .btn.ghost { background:transparent; }
  .btn.ghost:hover { background:rgba(244,246,251,.08); }
  .btn.big { font-size:18px; padding:15px 28px; border-radius:14px; }
  .btn:disabled { opacity:.45; cursor:default; transform:none; }
  .btn:focus-visible, .pin:focus-visible, .chip-btn:focus-visible { outline:3px solid #FFD2C9; outline-offset:3px; }
  .muted { color:var(--muted); font-size:14px; }

  /* ---- header + mission track ---- */
  header { display:flex; align-items:center; gap:18px; padding:14px 24px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:18px; }
  .orbit { width:30px; height:30px; border-radius:50%; background:var(--blue); position:relative; flex:none; box-shadow:0 0 0 2px rgba(255,255,255,.15); }
  .orbit::after { content:""; position:absolute; inset:6px -6px; border:2px solid var(--red); border-radius:50%; transform:rotate(-25deg); }
  .track { flex:1; display:flex; justify-content:center; gap:6px; list-style:none; margin:0; padding:0; counter-reset:step; }
  .track li { counter-increment:step; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; padding:6px 12px; border-radius:999px; }
  .track li::before { content:counter(step); display:grid; place-items:center; width:24px; height:24px; border-radius:50%;
                      border:1.5px solid rgba(244,246,251,.35); font-size:12px; font-weight:700; }
  .track li.done { color:var(--ink); }
  .track li.done::before { background:rgba(252,61,33,.25); border-color:var(--red); }
  .track li.now { color:var(--ink); background:rgba(244,246,251,.08); font-weight:700; }
  .track li.now::before { background:var(--red); border-color:var(--red); color:#fff; }
  @media (max-width:860px) { .track li:not(.now) span { display:none; } .track { order:3; flex-basis:100%; } }

  main { max-width:1080px; margin:0 auto; padding:26px 20px 48px; }
  .stage-head { margin:6px 0 22px; max-width:720px; }
  .stage-head h2 { font-family:var(--display); font-size:clamp(30px,4.2vw,48px); line-height:1.15; margin:0 0 10px; font-weight:700; }
  .stage-head p { margin:0; color:var(--muted); font-size:17px; line-height:1.75; }

  /* ---- who are you: choose a character ---- */
  .who-grid { display:grid; grid-template-columns:repeat(3, minmax(0, 260px)); justify-content:center; gap:clamp(16px,3vw,34px); }
  .who { background:none; border:0; padding:0; color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .who-pic { position:relative; width:100%; aspect-ratio:3/4; border-radius:24px; overflow:hidden; background:#070B16;
             box-shadow:inset 0 0 0 1px rgba(244,246,251,.14); transition:transform .25s ease, box-shadow .25s ease; }
  .who-pic img, .who-pic svg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .who.active:hover .who-pic { transform:translateY(-6px); box-shadow:inset 0 0 0 2px var(--acc), 0 24px 60px -24px var(--acc); }
  .who.active .who-pic { box-shadow:inset 0 0 0 2px var(--acc), 0 20px 50px -30px var(--acc); }
  .who.locked { cursor:default; }
  .who.locked .who-pic img, .who.locked .who-pic svg { filter:grayscale(.85) brightness(.55); }
  .who-soon { position:absolute; top:14px; inset-inline-start:14px; font-size:13px; font-weight:700; padding:4px 12px; border-radius:999px;
              background:rgba(5,10,26,.8); color:var(--muted); }
  .who-name { font-family:var(--display); font-size:24px; font-weight:700; }
  .who.locked .who-name { color:var(--muted); }
  .who:focus-visible { outline:3px solid #FFD2C9; outline-offset:6px; border-radius:24px; }
  @media (max-width:640px) { .who-grid { grid-template-columns:repeat(3, 1fr); gap:10px; } .who-name { font-size:16px; } .who-pic { border-radius:16px; } }

  /* ---- 0. opening screen: machines on a map of Mars ---- */
  .mars { position:relative; border-radius:22px; overflow:hidden; aspect-ratio:1000/340; background:#3A1A12;
          box-shadow:0 30px 80px -30px rgba(252,61,33,.45), inset 0 0 0 1px rgba(244,246,251,.12); }
  .mars svg { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .pin { position:absolute; transform:translate(-50%,-9px); background:none; border:0; padding:0; cursor:pointer; color:var(--ink);
         display:flex; flex-direction:column; align-items:center; gap:7px; }
  .pin .dot { width:18px; height:18px; border-radius:50%; background:var(--ink); box-shadow:0 0 0 4px rgba(5,10,26,.55); position:relative; }
  .pin.locked .dot { background:rgba(5,10,26,.4); border:2px solid rgba(244,246,251,.75); }
  .pin.active .dot { background:var(--red); }
  .pin.active .dot::after { content:""; position:absolute; inset:-10px; border-radius:50%; border:2px solid var(--red); animation:ping 1.8s ease-out infinite; }
  @keyframes ping { from { transform:scale(.6); opacity:1; } to { transform:scale(1.8); opacity:0; } }
  .pin .name { font-size:14px; font-weight:700; background:rgba(5,10,26,.72); padding:3px 11px; border-radius:999px; white-space:nowrap; }
  .pin.locked .name { color:#D6DCEB; font-weight:600; }
  .pin[aria-pressed="true"] .name { background:var(--ink); color:var(--night); }
  .map-note { margin:10px 4px 0; }
  .pin.up { flex-direction:column-reverse; transform:translate(-50%, calc(-100% + 9px)); }

  /* space view: the Moon and Mars */
  .space { position:relative; border-radius:22px; overflow:hidden; min-height:420px; touch-action:pan-y; display:flex;
           background:radial-gradient(ellipse at 50% 120%, rgba(47,107,216,.25), transparent 60%), rgba(5,10,26,.55);
           box-shadow:inset 0 0 0 1px rgba(244,246,251,.10); }
  .space-inner { flex:1; display:flex; justify-content:center; align-items:center; gap:clamp(30px,9vw,120px); padding:46px 20px 40px;
                 will-change:transform; }
  .snap { transition:transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s ease; }
  .snap .body-btn { transition:opacity .45s ease; }
  .body-btn { background:none; border:0; color:var(--ink); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:12px;
              padding:10px; border-radius:24px; transition:transform .25s ease; }
  .body-btn:hover { transform:translateY(-4px); }
  .body-btn:focus-visible { outline:3px solid #FFD2C9; outline-offset:6px; }
  .planet { display:block; border-radius:50%; transition:transform .6s cubic-bezier(.5,0,.2,1), opacity .5s ease; }
  .moon-p { width:clamp(150px,20vw,210px); aspect-ratio:1;
            background:radial-gradient(circle at 34% 30%, #F1F1EC, #BDBDB6 45%, #6F6F6A 80%, #3F3F3C);
            box-shadow:0 0 70px rgba(230,230,220,.22), inset -18px -12px 40px rgba(0,0,0,.45); position:relative; }
  .mars-p { width:clamp(180px,25vw,260px); aspect-ratio:1;
            background:radial-gradient(circle at 34% 30%, #F0A273, #C96D3F 45%, #8E3F22 78%, #4A1C0E);
            box-shadow:0 0 80px rgba(252,61,33,.35), inset -20px -14px 44px rgba(0,0,0,.45); }
  .moon-p::before, .moon-p::after { content:""; position:absolute; border-radius:50%; background:rgba(70,70,66,.35); }
  .moon-p::before { width:34%; height:26%; left:22%; top:24%; }
  .moon-p::after { width:22%; height:18%; left:56%; top:48%; }
  .body-name { font-family:var(--display); font-size:26px; font-weight:700; }
  .mars, .moon { touch-action:pan-y; will-change:transform; }
  .zoom-hint { margin:10px 4px 0; display:flex; align-items:center; gap:8px; }
  .zoom-hint svg { flex:none; opacity:.8; }
  .view-enter { animation:enter .55s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes enter { from { opacity:0; transform:scale(.94); } }
  .view-head { display:flex; align-items:center; gap:14px; margin:0 0 12px; }
  /* surface view: map and machine card side by side, so everything fits on one screen */
  .body-layout { display:block; }
  .body-main .mars { aspect-ratio:1000/360; }
  .body-main .moon { aspect-ratio:1000/480; }
  .pin.nudge .dot { animation:nudge .4s ease; }
  @keyframes nudge { 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
  .body-layout .machine { grid-template-columns:1fr; margin-top:0; gap:12px; padding:20px; align-items:start; }
  .body-layout .machine .art { width:100%; height:104px; }
  .body-layout .machine h3 { font-size:24px; }
  .body-layout .machine .what { font-size:15.5px; }
  .body-layout .machine .btn { width:100%; }
  @media (max-width:980px) { .body-layout { grid-template-columns:1fr; } }
  .view-head h3 { font-family:var(--display); font-size:clamp(28px,3.6vw,40px); margin:4px 0 0; font-weight:700; flex:1; }

  /* the Moon, near side */
  .moon { position:relative; border-radius:22px; overflow:hidden; aspect-ratio:1000/470; display:flex; justify-content:center;
          background:radial-gradient(ellipse at 50% 50%, rgba(230,230,220,.10), transparent 60%), rgba(5,10,26,.6);
          box-shadow:inset 0 0 0 1px rgba(244,246,251,.10); }
  .moon-disk { position:relative; height:100%; aspect-ratio:1; }
  .moon-disk svg { position:absolute; inset:0; width:100%; height:100%; }
  @media (prefers-reduced-motion: reduce) { .planet, .body-btn { transition:none; } .view-enter { animation:none; } }
  @media (max-width:760px) { .space { flex-direction:column; min-height:0; gap:26px; } .moon { aspect-ratio:1; } }
  .machine { display:grid; grid-template-columns:170px 1fr auto; gap:18px 28px; align-items:center; margin-top:18px;
             padding:22px 26px; border-radius:20px; background:linear-gradient(135deg, rgba(11,61,145,.32), rgba(10,20,51,.6)); border:1px solid var(--line); }
  .machine .art { width:170px; height:116px; display:grid; place-items:center; border-radius:14px; background:rgba(5,10,26,.45); }
  .machine .art svg { width:150px; height:104px; }
  .machine h3 { font-family:var(--display); margin:0 0 4px; font-size:28px; font-weight:700; }
  .machine .where { color:#FFB4A6; font-size:15px; margin:0 0 8px; }
  .machine .what { margin:0; color:#DCE3F2; font-size:16.5px; line-height:1.75; max-width:60ch; }
  @media (max-width:760px) {
    .mars, .body-main .mars { aspect-ratio:1000/720; } .body-main .moon { aspect-ratio:1; } .pin .name { font-size:12px; padding:2px 8px; }
  }

  /* ---- 1. story scene (left as it is: the 3D team replaces it) ---- */
  .scene-wrap { position:relative; border-radius:14px; overflow:hidden; border:1px solid var(--line); }
  canvas#scene { display:block; width:100%; height:auto; background:#000; }
  .subtitle { position:absolute; inset:auto 0 0 0; padding:14px 20px; background:linear-gradient(transparent, rgba(0,0,0,.8));
              font-size:17px; line-height:1.6; min-height:60px; }
  .controls { display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; align-items:center; }
  .controls .spacer { flex:1; }

  /* the real 3D scene, full window inside the site */
  .scene3d { position:fixed; inset:0; z-index:50; background:#000; }
  #scene3dFrame { width:100%; height:100%; border:0; display:block; background:#000; }
  #btn3dFinish { position:absolute; inset-inline-end:24px; bottom:24px; box-shadow:0 12px 40px -12px rgba(0,0,0,.8); }

  /* ---- 2. engineer challenge ---- */
  .challenge-frame { border-radius:22px; overflow:hidden; border:1px solid var(--line); box-shadow:0 30px 80px -40px rgba(47,107,216,.6); }
  iframe { width:100%; height:560px; border:0; display:block; background:transparent; }

  /* ---- 3. mission reel ---- */
  .reel-grid { display:grid; grid-template-columns:minmax(260px,340px) 1fr; gap:40px; align-items:start; }
  .phone { position:relative; border-radius:42px; padding:12px; background:linear-gradient(160deg,#1B2647,#0A1022);
           box-shadow:0 40px 90px -30px rgba(0,0,0,.8), inset 0 0 0 1px rgba(244,246,251,.14); }
  .phone::before { content:""; position:absolute; top:22px; left:50%; width:84px; height:22px; margin-left:-42px; border-radius:20px; background:#050A1A; z-index:2; }
  .screen { position:relative; aspect-ratio:9/16; border-radius:32px; overflow:hidden; background:var(--space); }
  .screen canvas, .screen video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .screen .bar { position:absolute; left:18px; right:18px; bottom:18px; height:6px; border-radius:6px; background:rgba(244,246,251,.18); overflow:hidden; }
  .screen .bar > div { height:100%; width:0; background:var(--red); transition:width .1s linear; }
  .steps { display:flex; flex-direction:column; gap:14px; }
  .step-card { padding:20px 22px; border-radius:18px; background:var(--panel); border:1px solid var(--line); }
  .step-card h3 { font-family:var(--display); font-size:21px; margin:0 0 6px; font-weight:700; display:flex; align-items:center; gap:10px; }
  .step-card h3 b { display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--red); font-size:14px; font-family:inherit; flex:none; }
  .step-card p { margin:0 0 12px; color:var(--muted); font-size:15px; line-height:1.6; }
  .photo-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .helmet-mini { width:64px; height:64px; border-radius:50%; background:#0b1430; border:5px solid #E9EDF5; object-fit:cover; flex:none; }
  .ribbon { padding:14px 18px; border-radius:14px; background:rgba(76,195,138,.12); border:1px solid rgba(76,195,138,.5); color:#BFF0D5; font-weight:600; line-height:1.6; }
  .tags { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 14px; border-radius:12px; background:rgba(5,10,26,.55);
          border:1px dashed rgba(244,246,251,.25); direction:ltr; }
  .tags code { font-family:"Space Grotesk","Segoe UI",sans-serif; color:#FFB4A6; font-size:14.5px; line-height:1.6; flex:1; min-width:200px; }
  .chip-btn { background:var(--ink); color:var(--night); border:0; border-radius:999px; padding:7px 14px; font-weight:700; cursor:pointer; font-size:13px; }
  .reel-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  @media (max-width:760px) { .reel-grid { grid-template-columns:1fr; } .phone { max-width:300px; margin:0 auto; } }

  @media (prefers-reduced-motion: reduce) { .pin.active .dot::after { animation:none; opacity:.6; } .btn { transition:none; } }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="orbit" aria-hidden="true"></span><span data-t="appTitle"></span></div>
  <ol class="track" id="track" aria-label="steps">
    <li data-stage="st-who"><span data-t="s0"></span></li>
    <li data-stage="st-pick"><span data-t="s1"></span></li>
    <li data-stage="st-story"><span data-t="s2"></span></li>
    <li data-stage="st-challenge"><span data-t="s3"></span></li>
    <li data-stage="st-reel"><span data-t="s4"></span></li>
  </ol>
  <button class="btn ghost" id="btnLang"></button>
</header>

<main>
  <!-- Who are you on this mission? (choose a character) -->
  <section class="stage" id="st-who" hidden>
    <div class="stage-head"><h2 data-t="whoTitle"></h2></div>
    <div class="who-grid" id="whoGrid"></div>
  </section>

  <!-- 0. Opening screen: choose a machine on the map of Mars -->
  <section class="stage" id="st-pick" hidden>
    <div class="stage-head" id="pickHead">
      <h2 data-t="pickTitle"></h2>
    </div>
    <div class="space" id="viewSpace">
      <div class="space-inner" id="spaceInner">
        <button class="body-btn" data-body="moon"><span class="planet moon-p"></span><span class="body-name" data-t="moon"></span></button>
        <button class="body-btn" data-body="mars"><span class="planet mars-p"></span><span class="body-name" data-t="mars"></span></button>
      </div>
    </div>
    <p class="muted zoom-hint" id="zoomHint"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5M11 8v6M8 11h6"/></svg><span id="zoomHintText"></span></p>
    <div id="viewBody" hidden>
    <div class="view-head"><h3 id="bodyTitle"></h3></div>
    <div class="body-layout"><div class="body-main">
    <div class="moon" id="moon" hidden>
      <div class="moon-disk" id="moonDisk">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs><radialGradient id="mg" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#EDEDE8"/><stop offset=".55" stop-color="#B9B9B2"/><stop offset="1" stop-color="#5E5E5A"/></radialGradient></defs>
          <circle cx="50" cy="50" r="45" fill="url(#mg)"/>
          <g fill="#6E6E69" opacity=".55">
            <ellipse cx="38" cy="30" rx="13" ry="10"/><ellipse cx="60" cy="33" rx="7" ry="6"/><ellipse cx="68" cy="47" rx="9" ry="7"/>
            <ellipse cx="27" cy="52" rx="12" ry="16"/><ellipse cx="73" cy="62" rx="6" ry="5"/><ellipse cx="45" cy="60" rx="7" ry="5"/>
          </g>
          <g fill="none" stroke="#F4F4EF" stroke-opacity=".35" stroke-width=".5">
            <circle cx="44" cy="80" r="3"/><circle cx="58" cy="72" r="2"/><circle cx="30" cy="70" r="1.6"/><circle cx="62" cy="20" r="1.8"/>
          </g>
          <circle cx="50" cy="50" r="45" fill="none" stroke="#F4F4EF" stroke-opacity=".25" stroke-width=".4"/>
        </svg>
      </div>
    </div>
    <div class="mars" id="mars" hidden>
      <svg viewBox="0 0 1000 340" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#A9502B"/><stop offset=".5" stop-color="#C96D3F"/><stop offset="1" stop-color="#8E3F22"/>
          </linearGradient>
          <linearGradient id="night" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#050A1A" stop-opacity=".55"/><stop offset=".22" stop-color="#050A1A" stop-opacity="0"/>
            <stop offset=".85" stop-color="#050A1A" stop-opacity="0"/><stop offset="1" stop-color="#050A1A" stop-opacity=".5"/>
          </linearGradient>
        </defs>
        <rect width="1000" height="340" fill="url(#ground)"/>
        <g fill="#5B2516" opacity=".38">
          <ellipse cx="560" cy="150" rx="70" ry="38"/><ellipse cx="300" cy="215" rx="120" ry="30"/>
          <ellipse cx="820" cy="250" rx="90" ry="26"/><ellipse cx="120" cy="120" rx="80" ry="22"/>
          <ellipse cx="690" cy="300" rx="140" ry="22"/><ellipse cx="430" cy="60" rx="110" ry="18"/>
        </g>
        <g fill="none" stroke="#E7A57E" stroke-opacity=".35" stroke-width="2">
          <circle cx="760" cy="238" r="16"/><circle cx="472" cy="98" r="14"/><circle cx="180" cy="270" r="20"/>
          <circle cx="905" cy="110" r="12"/><circle cx="350" cy="140" r="9"/><circle cx="610" cy="250" r="11"/>
          <circle cx="60" cy="210" r="8"/><circle cx="250" cy="70" r="10"/>
        </g>
        <g stroke="#F4D9C6" stroke-opacity=".12" stroke-width="1">
          <line x1="250" y1="0" x2="250" y2="340"/><line x1="500" y1="0" x2="500" y2="340"/><line x1="750" y1="0" x2="750" y2="340"/>
        </g>
        <line x1="0" y1="170" x2="1000" y2="170" stroke="#F4D9C6" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="6 8"/>
        <rect width="1000" height="340" fill="url(#night)"/>
      </svg>
    </div>
    </div>
    </div>
    </div>
  </section>

    if (zoom >= ZOOM_IN) { enterBody(target.dataset.body); $("spaceInner").style.transform = ""; return; }
  } else {
    zoom = Math.min(1, Math.max(ZOOM_OUT - 0.05, zoom * factor));
    paintBody();
    if (zoom <= ZOOM_OUT) { exitToSpace(); return; }
  }
  snapTimer = setTimeout(snapBack, 260);         // let go before the threshold: spring back
}
function zoomTo(btn) {                           // tap / click / Enter on a planet
  if (busy) return;
  target = btn; zoom = ZOOM_IN;
  if (reduceMotion) { enterBody(btn.dataset.body); return; }
  $("spaceInner").classList.add("snap"); paintSpace();
  busy = true;
  setTimeout(() => { $("spaceInner").classList.remove("snap"); busy = false; enterBody(btn.dataset.body); $("spaceInner").style.transform = ""; }, 430);
}
function onWheel(e) {
  if (view === "body" && e.deltaY < 0) return;   // scrolling up on a surface: let the page scroll
  e.preventDefault();
  const d = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomBy(Math.exp(-d * (e.ctrlKey ? 0.01 : 0.0025)), e.clientX);
}
function pinch(el) {
  const pts = new Map(); let startDist = 0, last = 1;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  el.addEventListener("pointerdown", e => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { startDist = dist(); last = 1; } });
  el.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && startDist) {
      const ratio = dist() / startDist, mid = [...pts.values()].reduce((a, p) => a + p.x, 0) / 2;
      zoomBy(ratio / last, mid); last = ratio;
    }
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size < 2) startDist = 0; };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end); el.addEventListener("pointerleave", end);
}
[$("viewSpace"), $("moon"), $("mars")].forEach(el => { el.addEventListener("wheel", onWheel, { passive: false }); pinch(el); });
document.querySelectorAll(".body-btn").forEach(b => b.onclick = () => zoomTo(b));
document.addEventListener("keydown", e => {
  if ($("st-pick").hidden || e.target.tagName === "INPUT") return;
  if (view === "body" && (e.key === "-" || e.key === "Escape")) exitToSpace();
});
function showSpace() {
  view = "space"; zoom = 1; target = null; busy = false;
  $("viewBody").hidden = true; $("viewSpace").hidden = false; $("pickHead").hidden = false;
  $("spaceInner").style.transform = "";
  document.querySelectorAll(".body-btn").forEach(b => b.style.opacity = "");
  setHint();
}
function showPicker() { Reel.reset(); showSpace(); show("st-pick"); }

// ---------------- stand-in scene (2D canvas) ----------------
const canvas = $("scene"), g = canvas.getContext("2d");
let audio = null, master = null;
const rover = { x: 260, vx: 0, wheel: 0, arm: 0, digging: 0 };
let hole = 0, particles = [];

function ensureAudio() {
  if (audio) { if (audio.state === "suspended") audio.resume(); return; }
  audio = new (window.AudioContext || window.webkitAudioContext)();
  master = audio.createGain();
  master.connect(audio.destination);
  // 3D team: same line, with your master gain (or THREE.AudioListener gain)
  master.connect(Reel.attach(canvas, audio));
}

function noiseBurst(seconds, freq, vol) {
  const len = audio.sampleRate * seconds, buf = audio.createBuffer(1, len, audio.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = audio.createBufferSource(); src.buffer = buf;
  const f = audio.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq;
  const gn = audio.createGain(); gn.gain.value = vol;
  src.connect(f); f.connect(gn); gn.connect(master); src.start();
}
function motor(seconds) {
  const o = audio.createOscillator(), gn = audio.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(70, audio.currentTime);
  o.frequency.linearRampToValueAtTime(110, audio.currentTime + seconds);
  gn.gain.setValueAtTime(0.06, audio.currentTime);
  gn.gain.linearRampToValueAtTime(0, audio.currentTime + seconds);
  o.connect(gn); gn.connect(master); o.start(); o.stop(audio.currentTime + seconds);
}

$("btnPush").onclick = () => {
  ensureAudio();
  rover.vx = 7;
  if (rover.x > canvas.width - 260) rover.x = 120;
  noiseBurst(1.4, 400, 0.5); motor(1.4);
  Reel.captureMoment("push"); setTimeout(updateMoments, 3800);
};
$("btnDig").onclick = () => {
  ensureAudio();
  rover.digging = 90;
  for (let i = 0; i < 4; i++) setTimeout(() => noiseBurst(0.25, 1200, 0.7), i * 350);
  Reel.captureMoment("dig"); setTimeout(updateMoments, 3800);
};

function draw() {
  const w = canvas.width, h = canvas.height, ground = 400;
  const sky = g.createLinearGradient(0, 0, 0, ground);
  sky.addColorStop(0, "#3b1d14"); sky.addColorStop(1, "#c2734a");
  g.fillStyle = sky; g.fillRect(0, 0, w, ground);
  g.fillStyle = "#f3d9b0"; g.beginPath(); g.arc(780, 90, 26, 0, Math.PI * 2); g.fill();   // sun
  g.fillStyle = "#8a3f22";
  g.beginPath(); g.moveTo(0, ground); g.lineTo(150, 300); g.lineTo(330, ground); g.fill();
  g.beginPath(); g.moveTo(520, ground); g.lineTo(720, 280); g.lineTo(960, ground); g.fill();
  g.fillStyle = "#a9552f"; g.fillRect(0, ground, w, h - ground);

  // physics
  rover.x += rover.vx; rover.vx *= 0.96; rover.wheel += rover.vx * 0.08;
  if (rover.x > w - 160) { rover.x = w - 160; rover.vx = 0; }
  if (Math.abs(rover.vx) > 0.4 && Math.random() < 0.6)
    particles.push({ x: rover.x - 10, y: ground - 4, vx: -1 - Math.random() * 2, vy: -Math.random() * 2, life: 40 });
  if (rover.digging > 0) {
    rover.digging--; rover.arm = Math.sin(rover.digging / 6) * 0.5 + 0.6; hole = Math.min(40, hole + 0.25);
    if (Math.random() < 0.7) particles.push({ x: rover.x + 150, y: ground, vx: Math.random() * 3 - 1, vy: -2 - Math.random() * 3, life: 50 });
  } else rover.arm *= 0.95;

  // hole
  g.fillStyle = "#5a2814";
  g.beginPath(); g.ellipse(rover.x + 150, ground + 6, 28 + hole * 0.3, 6 + hole * 0.2, 0, 0, Math.PI * 2); g.fill();

  // rover
  const x = rover.x, y = ground - 70;
  g.fillStyle = "#1d3f8f"; g.fillRect(x - 20, y - 18, 140, 10);                  // solar panel
  g.fillStyle = "#e6e9ef"; g.fillRect(x, y, 100, 40);                             // body
  g.fillStyle = "#9aa3b5"; g.fillRect(x + 70, y - 60, 6, 60);                     // mast
  g.fillStyle = "#e6e9ef"; g.fillRect(x + 60, y - 72, 28, 14);                    // camera head
  g.fillStyle = "#FC3D21"; g.fillRect(x + 82, y - 68, 5, 5);
  g.save(); g.translate(x + 100, y + 20); g.rotate(rover.arm);                    // arm
  g.fillStyle = "#c9ced8"; g.fillRect(0, -4, 55, 8); g.fillRect(50, -4, 8, 30); g.restore();
  for (const wx of [x + 10, x + 50, x + 90]) {                                    // wheels
    g.save(); g.translate(wx, ground - 18); g.rotate(rover.wheel);
    g.fillStyle = "#2b2b2b"; g.beginPath(); g.arc(0, 0, 18, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#888"; g.lineWidth = 3; g.beginPath(); g.moveTo(-14, 0); g.lineTo(14, 0); g.stroke();
    g.restore();
  }
  // dust
  particles = particles.filter(p => p.life-- > 0);
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08;
    g.globalAlpha = p.life / 50; g.fillStyle = "#d8a27a"; g.fillRect(p.x, p.y, 4, 4);
  }
  g.globalAlpha = 1;
  requestAnimationFrame(draw);
}
draw();

// ---------------- flow ----------------
function title(p) { return lang === "ar" ? p.title_ar : p.title; }
function machineFor(p) { return MACHINES.find(m => m.problem === p.id) || machine; }
function setProblem(id) {
  problem = problems.find(p => p.id === id) || problems.find(p => p.id === "cohesive_soil") || problems[0];
  machine = machineFor(problem);
  $("subtitle").textContent = T.story(title(problem));
  Reel.reset(); updateMoments(); show("st-story");
}

async function init() {
  const res = await fetch("/api/problems");
  problems = (await res.json()).problems;
  renderCharacters();
  renderPins();
  selectMachine(MACHINES.find(m => m.active));
  setHint();
  // ?problem=<id> skips the opening screen (useful when the 3D scene links back here)
  if (params.get("problem")) { chooseCharacter(CHARACTERS.find(c => c.active)); setProblem(params.get("problem")); }
  else show("st-who");
}

$("btnFinish").onclick = () => {
  result = null;
  $("btnToReel").disabled = true;
  $("challenge").src = `/?problem=${problem.id}&lang=${lang}`;
  show("st-challenge");
};

// ---------------- real 3D scenes (static/insight/ is the 3D team's InSight scene) ----------------
// The scene opens full window inside the site. It tells us when Mars opens and when each
// mission starts and ends (static/insight/src/bridge.js). Here we play the narration and the
// sounds, record reel moments from its canvas, and offer "Story finished" after a mission.
const SCENES_3D = { insight: "insight/" };
const SOUNDS = "sounds/";
const NARRATION = { begin: "narr_intro", temperature: "narr_dig", marsquakes: "narr_quake" };
const EFFECTS = { begin: "begin", temperature: "dig", marsquakes: "quake" };
const NARR_RATE = 1.08;                      // same pace as the demo video
const VOL = { voice: 1.0, sfx: 0.8, wind: 0.6, windUnder: 0.35 };
// reel moments after each event (ms, label)
const MOMENTS = { begin: [[5000, "mars"]], temperature: [[2500, "dig"], [15000, "dig"]], marsquakes: [[3000, "quake"], [17000, "quake"]] };
function later(ms, fn) { if (scene3d) scene3d.timers.push(setTimeout(fn, ms)); }
function loadSounds(s) {
  Object.values(EFFECTS).concat("wind").forEach(name =>
    fetch(SOUNDS + name + ".mp3").then(r => r.arrayBuffer()).then(b => audio.decodeAudioData(b))
      .then(buf => { s.buffers[name] = buf; }).catch(err => console.warn("sound", name, err)));
}
function fadeOut(node, onDone) {
  const t = audio.currentTime;
  node.gain.cancelScheduledValues(t); node.gain.setValueAtTime(node.gain.value, t); node.gain.linearRampToValueAtTime(0, t + 0.4);
  setTimeout(onDone, 450);
}
function setWind(level) {
  if (!scene3d || !scene3d.windGain) return;
  const t = audio.currentTime; scene3d.windGain.gain.cancelScheduledValues(t);
  scene3d.windGain.gain.setValueAtTime(scene3d.windGain.gain.value, t); scene3d.windGain.gain.linearRampToValueAtTime(level, t + 0.6);
}
function startWind() {
  const buf = scene3d.buffers.wind;
  if (!buf) { later(500, startWind); return; }
  const src = audio.createBufferSource(), gn = audio.createGain();
  src.buffer = buf; src.loop = true; src.loopStart = 0.06; src.loopEnd = buf.duration - 0.06;
  gn.gain.value = 0; src.connect(gn); gn.connect(master); src.start(0, 0.06);
  scene3d.wind = src; scene3d.windGain = gn;
  setWind(scene3d.voice ? VOL.windUnder : VOL.wind);
}
function playSfx(name) {
  const s = scene3d, buf = s.buffers[name];
  if (!buf) return;
  if (s.sfx) { const old = s.sfx; fadeOut(old.gn, () => old.src.stop()); }
  const src = audio.createBufferSource(), gn = audio.createGain();
  src.buffer = buf; gn.gain.value = VOL.sfx; src.connect(gn); gn.connect(master); src.start();
  s.sfx = { src, gn };
}
function stopVoice() {
  const v = scene3d && scene3d.voice;
  if (!v) return;
  scene3d.voice = null;
  fadeOut(v.gn, () => v.el.pause());
}
function playVoice(name) {
  stopVoice();
  const el = new Audio(SOUNDS + name + ".mp3");
  el.defaultPlaybackRate = el.playbackRate = NARR_RATE; el.preservesPitch = true;
  const gn = audio.createGain(); gn.gain.value = VOL.voice;
  audio.createMediaElementSource(el).connect(gn); gn.connect(master);
  const v = { el, gn }; scene3d.voice = v;
  el.onended = () => { if (scene3d && scene3d.voice === v) { scene3d.voice = null; setWind(VOL.wind); } };
  setWind(VOL.windUnder);
  el.play().catch(err => console.warn("narration", err));
}
function open3D(m) {
  ensureAudio();
  scene3d = { buffers: {}, timers: [], voice: null, sfx: null, wind: null, windGain: null };
  loadSounds(scene3d);
  $("btn3dFinish").hidden = true;
  $("scene3d").hidden = false;
  document.body.style.overflow = "hidden";
  $("scene3dFrame").src = SCENES_3D[m.id];
  $("scene3dFrame").focus();
}
function close3D() {
  if (!scene3d) return;
  const s = scene3d;
  s.timers.forEach(clearTimeout);
  try { $("scene3dFrame").contentDocument.exitPointerLock(); } catch (e) {}
  if (s.voice) s.voice.el.pause();
  [s.sfx && s.sfx.src, s.wind].forEach(src => { try { src && src.stop(); } catch (e) {} });
  scene3d = null;
  $("scene3dFrame").src = "about:blank";
  $("scene3d").hidden = true;
  document.body.style.overflow = "";
}
window.addEventListener("message", e => {
  const d = e.data;
  if (!scene3d || !d || d.type !== "insight-scene" || e.source !== $("scene3dFrame").contentWindow) return;
  const key = d.event === "begin" ? "begin" : d.id;
  if (d.event === "begin") {
    const cnv = $("scene3dFrame").contentDocument.querySelector("canvas");
    if (cnv) master.connect(Reel.attach(cnv, audio));   // reel moments come from the 3D canvas
    startWind();
  }
  if (d.event === "begin" || d.event === "mission-start") {
    playSfx(EFFECTS[key]);
    if (NARRATION[key]) later(d.event === "begin" ? 300 : 400, () => playVoice(NARRATION[key]));
    (MOMENTS[key] || []).forEach(([ms, label]) => later(ms, () => Reel.captureMoment(label)));
  }
  if (d.event === "mission-end") {
    try { $("scene3dFrame").contentDocument.exitPointerLock(); } catch (e) {}   // free the mouse for the button
    $("btn3dFinish").hidden = false;
  }
});
$("btn3dFinish").onclick = () => $("btnFinish").onclick();

// The agent page tells us how the challenge ended
window.addEventListener("message", e => {
  if (!e.data || e.data.type !== "mission-engineer-result") return;
  result = e.data;
  $("btnToReel").disabled = false;
});

function reelOptions() {
  return {
    title: title(problem), machine: machine ? machine[lang].short : "", machineTag: machine ? machine.tag : "",
    fact: lang === "ar" ? problem.fact_ar : problem.fact, badge: !!(result && result.badge), photo, lang,
    character: character && character.image.complete && character.image.naturalWidth ? character : null
  };
}
function drawPoster() { Reel.drawPoster($("poster"), reelOptions()); }

$("btnToReel").onclick = () => {
  reel = null;
  $("badgeRibbon").hidden = !(result && result.badge);
  $("badgeRibbon").textContent = T.badgeYes;
  $("out").hidden = $("bar").hidden = true; $("poster").hidden = false;
  $("buildMsg").textContent = Reel.canRecord ? T.buildHint : T.noRecord;
  $("btnBuild").disabled = !Reel.canRecord;
  $("btnShare").disabled = true; $("btnShare").textContent = T.share;
  const tags = Reel.hashtags({ machineTag: machine ? machine.tag : "" });
  $("tagsText").textContent = tags.join(" ");
  show("st-reel");
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(drawPoster);
};

$("photoInput").onchange = async e => {
  photo = await Reel.loadPhoto(e.target.files[0]);
  if (photo) $("helmetPreview").src = photo.src;
  if (!reel) drawPoster();
};

$("btnBuild").onclick = async () => {
  if (!Reel.clipCount && !Reel.isRecording) { $("buildMsg").textContent = T.noClips; return; }
  $("btnBuild").disabled = true;
  $("out").hidden = true; $("poster").hidden = false; $("bar").hidden = false;
  $("buildMsg").textContent = T.building;
  try {
    reel = await Reel.build(Object.assign(reelOptions(), {
      onProgress: p => $("bar").firstElementChild.style.width = (p * 100) + "%"
    }));
    $("out").src = reel.url; $("out").hidden = false; $("poster").hidden = true; $("bar").hidden = true;
    const canShare = navigator.canShare && navigator.canShare({ files: [new File([reel.blob], "r." + reel.extension, { type: reel.mimeType })] });
    $("btnShare").textContent = canShare ? T.share : T.download;
    $("btnShare").disabled = false;
    $("buildMsg").textContent = T.ready;
  } catch (err) {
    console.error(err);
    $("buildMsg").textContent = T.noRecord;
  }
  $("btnBuild").disabled = false;
};
$("btnCopy").onclick = async () => {
  const txt = reel ? reel.caption : $("tagsText").textContent;
  try { await navigator.clipboard.writeText(txt); } catch (e) { /* clipboard blocked: the text is still visible to copy */ }
  $("btnCopy").textContent = T.copied;
  setTimeout(() => $("btnCopy").textContent = T.copy, 1600);
};
$("btnShare").onclick = () => reel && Reel.share(reel, "mission-reel");
$("btnRestart").onclick = () => { Reel.reset(); showSpace(); show("st-who"); };
$("btnBack").onclick = showPicker;

init();
</script>
